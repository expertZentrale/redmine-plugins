# Structured, language-neutral facts about each plugin.
# SINGLE SOURCE OF TRUTH for version-adjacent claims on the site.
# Prose lives in the Markdown pages; anything factual lives here.
#
# "expert" is the company name and is ALWAYS lowercase in user-facing text.

- id: helpdesk
  name: expert Helpdesk
  repo: expertZentrale/redmine_expert_helpdesk
  order: 1
  accent: '#F04C00'
  license: GPL-2.0-or-later
  redmine_floor: '5.0'
  redmine: ['5.1', '6.0', '6.1', '7.0']
  ruby: {'5.1': '3.2', '6.0': '3.3', '6.1': '3.3', '7.0': '3.4'}
  ci: true
  ci_docker: true
  databases: [MariaDB, MySQL]
  # The SLA issue-list columns compare against UTC_TIMESTAMP() in
  # lib/redmine_expert_helpdesk/patches/issue_query_patch.rb, which PostgreSQL
  # does not have. CI runs on MariaDB 11.4 only. Do not claim PostgreSQL.
  databases_note: true
  gems: [base64]
  gems_optional: [pdf-reader, pg]
  migrations: 50
  vendored:
    - {name: 'Chart.js', version: '4.4.6', license: MIT}
    - {name: 'chartjs-plugin-datalabels', version: '2.2.0', license: MIT}
  has_api: true
  has_settings: true
  shots_lang: true

