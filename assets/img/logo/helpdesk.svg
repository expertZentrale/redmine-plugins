<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 8 60 60" width="60" height="60">
  <!-- expert Helpdesk - square mark, no wordmark (website) -->
  <circle cx="50" cy="38" r="26.5" fill="none" stroke="#F04C00" stroke-width="2.6"/>

  <!-- red segmented arc (family element) -->
  <path d="M 32.5 25.5 A 21.5 21.5 0 0 1 67.5 25.5"
        fill="none" stroke="#CD291F" stroke-width="5.4"
        stroke-dasharray="6.2 2.55"/>

  <!-- envelope -->
  <g>
    <rect x="29" y="29" width="42" height="27" rx="3.4" fill="#F04C00"/>
    <path d="M 32.6 33.2 L 50 44.6 L 67.4 33.2"
          fill="none" stroke="#ffffff" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ticket stub along the bottom edge -->
    <rect x="32.6" y="48.6" width="34.8" height="4.2" rx="2.1" fill="#CD291F"/>
    <g stroke="#F04C00" stroke-width="1.2" stroke-linecap="round">
      <line x1="44.0" y1="48.6" x2="44.0" y2="52.8"/>
      <line x1="56.0" y1="48.6" x2="56.0" y2="52.8"/>
    </g>
  </g>
</svg>
